[project]
name = "between-jobs"
version = "0.0.1"
description = "Open-source, BYOK-first job-search platform -- the core of between-jobs.tech"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Pranav Kowadkar" }]
dependencies = [
    "fastapi>=0.115",
]

[project.urls]
Homepage = "https://between-jobs.tech"
Repository = "https://github.com/Career-Forge/between-jobs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/between_jobs"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
