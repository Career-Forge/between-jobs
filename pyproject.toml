[project]
name = "between-jobs"
version = "0.0.1"
description = "Open-source, BYOK-first job-search platform -- the core of between-jobs.tech"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Pranav Kowadkar" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.10",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
]

[project.urls]
Homepage = "https://between-jobs.tech"
Repository = "https://github.com/Career-Forge/between-jobs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/between_jobs"]

[tool.ruff]
target-version = "py312"
line-length = 100
# latex-service (Sprint 3.2e) is an independent sub-project -- its own
# pyproject.toml/.venv/toolchain, deployed as its own service. Without
# this, `ruff check .`/`ruff format .` run from this repo's root sweep it
# up too (ruff recurses the whole tree by default); it stays linted, just
# under its own `latex-service/pyproject.toml` config, not this one.
extend-exclude = ["latex-service"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiomatic pattern (Depends()/Query()/etc as a default arg
# value) -- not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
