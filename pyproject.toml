[project]
name = "between-jobs"
version = "0.0.1"
description = "Open-source, BYOK-first job-search platform -- the core of between-jobs.tech"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Pranav Kowadkar" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.10",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "openai>=1.50",
    "cryptography>=43",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://between-jobs.tech"
Repository = "https://github.com/Career-Forge/between-jobs"

[project.optional-dependencies]
dev = [
    # Not used by the API itself (it talks to Postgres through Supabase). The integration
    # tests open direct Postgres connections to the local Supabase stack -- to run SQL,
    # and to hold transactions open and race them -- which the Supabase client cannot do.
    "asyncpg>=0.29",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/between_jobs"]

[tool.ruff]
target-version = "py312"
line-length = 100
# latex-service is an independent sub-project -- its own pyproject.toml/.venv/
# toolchain, deployed as its own service. Without this, `ruff check .`/
# `ruff format .` run from this repo's root sweep it up too (ruff recurses the
# whole tree by default); it stays linted, just under its own
# `latex-service/pyproject.toml` config, not this one.
extend-exclude = ["latex-service"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# E6's server-side D6 gate ports questionSafety.ts's own CONFUSABLES table
# (Cyrillic/Greek/fullwidth letters that render identically to Latin ones,
# folded back before matching so a tenant can't disguise a self-ID label
# past the check) and its own adversarial disguise test fixtures. RUF001
# ("ambiguous unicode character") exists to catch an ACCIDENTAL confusable
# slipping into ordinary source text -- here every flagged character is the
# deliberate subject of the code, named in its own inline comment, not a
# typo.
"src/between_jobs/api/application_answer_generator.py" = ["RUF001"]
"tests/test_application_answer_generator.py" = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiomatic pattern (Depends()/Query()/etc as a default arg
# value) -- not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker or stubs, and no third-party stub package exists
# for it either. Only the integration tests import it (it is a dev dependency), so
# this stays a narrow, single-library exception, not a general relaxation.
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration needs a local Supabase stack (`supabase start`); they're
# skipped unless asked for: `pytest -m local_supabase`.
addopts = "-q -m 'not local_supabase'"
markers = [
    "local_supabase: runs against a local Supabase stack (never a hosted project)",
]
asyncio_mode = "auto"
# The standalone operator scripts live at the repo root (scripts/), not inside the
# installed between_jobs package -- they are run by hand, not served by the API.
# Putting the root on sys.path is what makes `from scripts.<name> import ...`
# resolvable in the tests that exercise them.
pythonpath = ["."]
