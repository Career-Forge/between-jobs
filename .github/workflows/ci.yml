name: CI

# Every push to main and every pull request. Nothing here reads a secret: a pull request
# from a fork gets none, and these jobs need none -- the integration tests run against a
# throwaway Supabase stack started on the runner, never a hosted project. The one
# workflow that talks to a real project is migration-drift.yml, and it is gated.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run before it. Every other run gets a group
# of its own: a shared group would let a newer main commit replace an older one that is
# still waiting, and that commit would never get a CI result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    # The oldest Python the project supports (pyproject: requires-python) and the newest.
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  integration:
    # What the fakes in the fast suite cannot show: the SQL behind /link and the worker
    # leases (real transactions, locks, grants, triggers) and real Storage. Starts the
    # same local stack a developer uses, minus the services nothing here touches.
    name: Integration (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.113.0
      # Starting the stack applies every file in supabase/migrations, so a migration that
      # does not replay cleanly fails this job here.
      - name: Start the local Supabase stack
        run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pytest -m local_supabase
      - name: Show the stack's state if something failed
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          docker logs --tail 80 supabase_db_between-jobs || true
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A production build refuses to run without an https, non-local API origin
      # (web/scripts/apiBaseGuard.ts); this is a stand-in, nothing is deployed.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    # That the API image builds from a clean checkout and starts as the user it claims.
    # The properties that matter to its contents are pinned by tests/test_container_static.py.
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t between-jobs-api .
      - name: Runs as an unprivileged user and imports
        run: |
          test "$(docker run --rm --entrypoint id between-jobs-api -u)" = "10001"
          docker run --rm --entrypoint python between-jobs-api -c "import between_jobs.api.app"

  all-green:
    # One check to require in branch protection instead of five: it fails if any job
    # above failed, was cancelled, or was skipped.
    name: CI passed
    if: always()
    needs: [python, integration, web, extension, container]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "no job results at all"; exit 1; }
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "a job did not succeed: $result"; exit 1; }
          done
