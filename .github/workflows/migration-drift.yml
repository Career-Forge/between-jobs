name: Migration drift

# Fails if the migration files on main and the hosted project's recorded history disagree
# (scripts/check_migration_drift.py). CLAUDE.md: migrations ship only through the CLI,
# because SQL run in the dashboard records no version at all. A migration merged but not
# yet pushed to the project shows up here as drift too; that is the reminder to push it.
#
# THIS IS THE ONE WORKFLOW THAT HOLDS A REAL CREDENTIAL. What actually protects it:
#   - The GitHub environment `supabase-drift`, configured with "Deployment branches:
#     selected branches -> main" and required reviewers. The environment's secrets are
#     released only to a run on main that a reviewer approved. This is the control: the
#     `if:` below and the `on:` filters live in this file, which anyone with write access
#     can change on a branch, so they are not.
#   - Not triggering on pull_request at all, so a fork's code never runs with it.
#   - The token goes to one step, which runs only the Supabase CLI. The step that runs
#     code from this repository (the Python check) gets no secret.
#   - Every action is pinned to a full commit SHA, so a moved tag cannot swap in other code.
# Set the environment up in this order: create it, set the branch rule and reviewers, and
# only then add the secret and the variable. SUPABASE_ACCESS_TOKEN is account-wide (it
# reaches every project in the organisation), so never also create a repository or
# organisation secret with that name: a secret of the same name outside the environment
# is readable by any workflow.
#
# Until the environment holds both values the job warns and skips instead of failing.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/check_migration_drift.py"
      - ".github/workflows/migration-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Local migrations match the hosted project
    if: github.repository == 'Career-Forge/between-jobs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-drift
    steps:
      - name: Is the check set up?
        id: configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Migration drift check NOT RUN::The supabase-drift environment has no SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_REF variable, so nothing was compared."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.yes == 'true'
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.configured.outputs.yes == 'true'
        with:
          version: 2.113.0
      # The only step with the token, and the only thing it runs is the Supabase CLI. Written
      # to a file, not piped: a failing CLI then fails this step instead of being masked by
      # the pipe's last command.
      - name: Fetch the project's migration history
        if: steps.configured.outputs.yes == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked > "$RUNNER_TEMP/migrations.txt"
          cat "$RUNNER_TEMP/migrations.txt"
      # No secret here. Exit 0 no drift, 1 drift, 2 could not tell; the last two are red.
      - name: Compare it with the files
        if: steps.configured.outputs.yes == 'true'
        run: python3 scripts/check_migration_drift.py < "$RUNNER_TEMP/migrations.txt"
