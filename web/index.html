<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Between Jobs</title>
    <meta
      name="description"
      content="Between Jobs helps you find roles, track applications, prepare tailored resumes and practice interviews; it drafts and prepares, and you always submit."
    />
    <meta name="theme-color" content="#070607" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The two files nearly every first paint needs: body text and the serif headings. Fonts are
         always fetched in anonymous CORS mode, so a preload needs crossorigin even on the same origin. -->
    <link
      rel="preload"
      href="/src/fonts/ibm-plex-sans/IBMPlexSans-Regular-Latin1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/fonts/newsreader/newsreader-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Between Jobs" />
    <meta property="og:title" content="Between Jobs" />
    <meta
      property="og:description"
      content="Between Jobs helps you find roles, track applications, prepare tailored resumes and practice interviews; it drafts and prepares, and you always submit."
    />
    <meta property="og:url" content="https://between-jobs.tech/" />
    <meta property="og:image" content="https://between-jobs.tech/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Between Jobs. Draft, don't send. Fill, don't submit." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Between Jobs" />
    <meta
      name="twitter:description"
      content="Between Jobs helps you find roles, track applications, prepare tailored resumes and practice interviews; it drafts and prepares, and you always submit."
    />
    <meta name="twitter:image" content="https://between-jobs.tech/og-image.png" />

    <!-- Dark is the canonical design, so the page is painted before any script loads, which avoids a
         white flash. The build hashes this block into the Content-Security-Policy. -->
    <style>
      html {
        background: #070607;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
